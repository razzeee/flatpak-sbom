[package]
name = "flatpak-sbom"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
packageurl = "0.7.1"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
liblzma = "0.4"
bzip2 = "0.5"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
ar = "0.9"
backhand = { version = "0.25.5", default-features = false, features = ["xz", "gzip", "zstd", "lz4", "error-strings"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
