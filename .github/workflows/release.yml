name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - releases/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    with:
      live_content: true

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package corresponding source and dependency licenses
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          package="flatpak-sbom-v$version-source"
          mkdir -p "dist/$package" notices
          git archive HEAD | tar -x -C "dist/$package"
          cd "dist/$package"
          mkdir -p .cargo
          cargo vendor --locked --versioned-dirs vendor > .cargo/config.toml
          cargo metadata --offline --locked --format-version 1 > /dev/null
          find vendor -type f \( -iname '*license*' -o -iname '*copying*' -o -iname '*notice*' -o -iname '*copyright*' \) \
            -exec cp --parents '{}' ../../notices/ \;
          cd ..
          tar -czf "$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-notices
          path: notices/
          if-no-files-found: error

  build:
    needs: source
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$version"
          fi
          test -f "releases/v$version.md"
          echo "RELEASE_VERSION=v$version" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and smoke-test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/flatpak-sbom"
          "$binary" --help
          ldd "$binary"
          package="flatpak-sbom-$RELEASE_VERSION-$TARGET"
          mkdir -p "dist/$package/data"
          cp "$binary" LICENSE README.md "dist/$package/"
          cp data/purl2cpe.LICENSE "dist/$package/data/"
      - uses: actions/download-artifact@v8
        with:
          name: dependency-notices
          path: dist/flatpak-sbom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}/third-party-licenses
      - name: Create binary archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          package="flatpak-sbom-$RELEASE_VERSION-$TARGET"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "flatpak-sbom $RELEASE_TAG" \
            --notes-file "releases/$RELEASE_TAG.md"
